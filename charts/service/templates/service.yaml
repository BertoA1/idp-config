apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}
spec:
  selector:
    app.kubernetes.io/name: {{ .Release.Name }}
  ports:
    - port: {{ .Values.port }}
      {{- if .Values.metrics.enabled }}
      name: http  # the ServiceMonitor scrapes this port by name
      {{- end }}
      targetPort: {{ .Values.port }}
